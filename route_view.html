<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mulia Conference Route View</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #1e0e4b;
    color: #111827;
    padding: 24px 16px;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid #e5e7eb;
  }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 700; }
  .subtitle { font-size: 12px; color: #6b7280; margin: 0; }
  .picker {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 14px 20px;
    border-bottom: 1px solid #e5e7eb;
    background: #fafbfc;
  }
  .picker button {
    flex: 0 0 auto;
    background: #671f75;
    border: 1.5px solid #671f75;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 500;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .picker button:hover { background: #7a2589; border-color: #7a2589; }
  .picker button.active { background: #1e0e4b; color: #fff; border-color: #1e0e4b; }

  .map-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 600 / 609;
    background: #6ba267;
  }
  .map-wrap img {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  .map-wrap svg {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
  }
  .route-path {
    fill: none;
    stroke-width: 4.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
    stroke-dasharray: 1500;
    stroke-dashoffset: 1500;
    animation: draw 1.4s ease-out forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .pin { filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4)); }
  .callout-bg {
    fill: #fff;
    stroke-width: 1.5;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }
  .callout-text { font-size: 9px; font-weight: 700; }

  .details { padding: 16px 20px 20px; }
  .details h2 {
    font-size: 14px; margin: 0 0 10px; font-weight: 700;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .badge {
    background: #f3f4f6; color: #4b5563;
    padding: 3px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 600;
  }
  .badge.level-change { background: #fef3c7; color: #b45309; }
  .badge.cross-building { background: #cffafe; color: #155e75; }
  .badge.garden { background: #d1fae5; color: #065f46; }
  ol.steps { margin: 0; padding-left: 0; list-style: none; counter-reset: step; }
  ol.steps li {
    position: relative;
    padding: 8px 0 8px 22px;
    font-size: 13px;
    color: #374151;
    line-height: 1.5;
    border-left: 2px solid #e5e7eb;
    margin-left: 10px;
    counter-increment: step;
  }
  ol.steps li::before {
    content: counter(step);
    position: absolute; left: -13px; top: 8px;
    width: 22px; height: 22px;
    background: #fff;
    border: 2px solid #e5e7eb;
    border-radius: 50%;
    text-align: center; line-height: 18px;
    font-size: 11px; font-weight: 700; color: #6b7280;
  }
  ol.steps li.elevator::before {
    background: #fef3c7; border-color: #f59e0b; color: #b45309;
    content: "↓"; font-size: 14px;
  }
  ol.steps li.stairs-up::before {
    background: #d1fae5; border-color: #059669; color: #065f46;
    content: "↑"; font-size: 14px;
  }
  ol.steps li:last-child { border-left-color: transparent; }

  .legend-note {
    font-size: 11px; color: #6b7280; font-style: italic;
    padding: 0 20px 16px; margin: 0;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Where to next?</h1>
    <p class="subtitle">Pick a route — see it drawn on the map and read the steps below.</p>
  </header>

  <div class="picker" id="picker">
    <button data-route="grand-to-skybar" class="active">Grand → Sky Bar</button>
    <button data-route="skybar-to-grand">Sky Bar → Grand</button>

    <button data-route="soleil-to-grand">Soleil → Grand</button>

        <g class="pin">

          <text x="157" y="231" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">S</text>
        </g>

          <rect x="3" y="12" width="4" height="3" fill="#B45309"/>

        <g class="pin" transform="translate(180, 331)">

          <rect x="3" y="12" width="4" height="3" fill="#B45309"/>
          <rect x="7" y="9" width="4" height="3" fill="#B45309"/>
          <rect x="11" y="6" width="4" height="3" fill="#B45309"/>

      </g>

      <!-- Route 2: Grand Ballroom → Soleil (PURPLE in Figma) -->
      <g id="route-grand-to-soleil" class="route-group" style="display:none;">
        <path class="route-path"

        <g class="pin">
          <circle cx="77" cy="439" r="10" fill="#fff" stroke="#7C3AED" stroke-width="3"/>
          <text x="77" y="443" text-anchor="middle" font-size="10" font-weight="700" fill="#7C3AED">G</text>
        </g>
        <g class="pin">
          <circle cx="172" cy="219" r="10" fill="#fff" stroke="#7C3AED" stroke-width="3"/>
          <text x="172" y="223" text-anchor="middle" font-size="10" font-weight="700" fill="#7C3AED">So</text>
        </g>
        <!-- Placeholder stair node — team to confirm position & direction -->
        <g class="pin" transform="translate(140, 414)">
          <rect width="18" height="18" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
          <rect x="3" y="12" width="4" height="3" fill="#B45309"/>
          <rect x="7" y="9" width="4" height="3" fill="#B45309"/>
          <rect x="11" y="6" width="4" height="3" fill="#B45309"/>
        </g>
        <!-- Placeholder stair node near the top of the route -->
        <g class="pin" transform="translate(177, 220)">
          <rect width="18" height="18" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
          <rect x="3" y="12" width="4" height="3" fill="#B45309"/>
          <rect x="7" y="9" width="4" height="3" fill="#B45309"/>
          <rect x="11" y="6" width="4" height="3" fill="#B45309"/>

      <!-- Route 3: Grand Ballroom → The Café (GREEN in Figma) -->
      <g id="route-grand-to-cafe" class="route-group" style="display:none;">
        <path class="route-path"
              d="M 83 448 C 144 452, 152 454, 152 453 C 152 452, 152 427, 152 426 C 152 424, 184 431, 185 431 C 186 431, 185 392, 185 373 L 209 373"

        <g class="pin">
          <circle cx="83" cy="448" r="10" fill="#fff" stroke="#059669" stroke-width="3"/>
          <text x="83" y="452" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">G</text>
        </g>
        <g class="pin">
          <circle cx="209" cy="373" r="10" fill="#fff" stroke="#059669" stroke-width="3"/>

        </g>
        <!-- Placeholder stair node — early bend -->
        <g class="pin" transform="translate(143, 418)">

          <rect x="3" y="12" width="4" height="3" fill="#B45309"/>
          <rect x="7" y="9" width="4" height="3" fill="#B45309"/>
          <rect x="11" y="6" width="4" height="3" fill="#B45309"/>
        </g>
        <!-- Placeholder stair node — second level change -->
        <g class="pin" transform="translate(176, 374)">
          <rect width="18" height="18" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
          <rect x="3" y="12" width="4" height="3" fill="#B45309"/>
          <rect x="7" y="9" width="4" height="3" fill="#B45309"/>
          <rect x="11" y="6" width="4" height="3" fill="#B45309"/>
        </g>
      </g>

      <!-- Route 4: Grand Ballroom → Business Centre (RED in Figma) -->
      <g id="route-grand-to-business" class="route-group" style="display:none;">
        <path class="route-path"
              d="M 83 444 C 115 446, 129 445, 132 444 L 151 444 L 151 427 L 187 435 C 187 426, 187 407, 187 402 C 187 398, 200 401, 206 402"
              stroke="#DC2626"/>
        <g class="pin">
          <circle cx="83" cy="444" r="10" fill="#fff" stroke="#DC2626" stroke-width="3"/>
          <text x="83" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">G</text>
        </g>
        <g class="pin">
          <circle cx="206" cy="402" r="10" fill="#fff" stroke="#DC2626" stroke-width="3"/>

        </g>
        <!-- Placeholder stair node — at the vertical jog (likely level change) -->
        <g class="pin" transform="translate(142, 422)">
          <rect width="18" height="18" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
          <rect x="3" y="12" width="4" height="3" fill="#B45309"/>
          <rect x="7" y="9" width="4" height="3" fill="#B45309"/>

        </g>
        <!-- Placeholder stair node — second vertical section -->
        <g class="pin" transform="translate(178, 405)">
          <rect width="18" height="18" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
          <rect x="3" y="12" width="4" height="3" fill="#B45309"/>
          <rect x="7" y="9" width="4" height="3" fill="#B45309"/>
          <rect x="11" y="6" width="4" height="3" fill="#B45309"/>
        </g>
      </g>

      <!-- Route 5: Business Centre → The Café (BROWN in Figma) -->
      <g id="route-business-to-cafe" class="route-group" style="display:none;">
        <path class="route-path"
              d="M 207 398 C 216 398, 218 393, 218 391 L 218 383 L 204 380 L 207 370"
              stroke="#975102"
              stroke-width="5"/>
        <g class="pin">
          <circle cx="207" cy="398" r="10" fill="#fff" stroke="#975102" stroke-width="3"/>
          <text x="207" y="402" text-anchor="middle" font-size="10" font-weight="700" fill="#975102">B</text>
        </g>
        <g class="pin">
          <circle cx="207" cy="370" r="10" fill="#fff" stroke="#975102" stroke-width="3"/>
          <text x="207" y="374" text-anchor="middle" font-size="10" font-weight="700" fill="#975102">C</text>
        </g>
        <!-- Placeholder stair node — single level change on this short hop -->
        <g class="pin" transform="translate(220, 378)">
          <rect width="18" height="18" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
          <rect x="3" y="12" width="4" height="3" fill="#B45309"/>

          <rect x="11" y="6" width="4" height="3" fill="#B45309"/>

      </g>
    </svg>
  </div>

  <p class="legend-note">The numbered key on the right of the map shows every venue at the resort.</p>

  <div class="details" id="details"></div>
</div>

<script>
const ROUTES = {
  "grand-to-skybar": {
    title: "Grand Ballroom → Sky Bar",
    badges: [{label: "Traced in Figma", cls: ""}, {label: "Placeholder copy", cls: "level-change"}],
    steps: [
      "Exit the Grand Ballroom (26).",
      {text: "Take the stairs at this point (team to confirm direction).", elevator: true},
      "Walk north through the central spine of the resort.",
      {text: "Second level change here (team to confirm).", elevator: true},
      "Continue north — Sky Bar (10) is at the end of the courtyard."
    ]
  },
  "skybar-to-grand": {
    title: "Sky Bar → Grand Ballroom",
    group: "grand-to-skybar",
    badges: [{label: "Reverse route", cls: ""}, {label: "Placeholder copy", cls: "level-change"}],
    steps: [
      "Exit Sky Bar (10) and head south along the central courtyard.",
      {text: "First level change (team to confirm direction).", elevator: true},
      "Continue south through the resort spine.",
      {text: "Second level change (team to confirm direction).", elevator: true},
      "Arrive at the Grand Ballroom (26) entrance."
    ]
  },
  "grand-to-soleil": {
    title: "Grand Ballroom → Soleil",
    badges: [{label: "Traced in Figma", cls: ""}, {label: "Placeholder copy", cls: "level-change"}],
    steps: [
      "Exit the Grand Ballroom (26) and follow the western corridor.",
      {text: "Level change near the start (team to confirm).", elevator: true},
      "Continue north along the resort spine, past the central garden.",
      {text: "Second level change near the top (team to confirm).", elevator: true},
      "Soleil (team to confirm number) is at the end of the path."
    ]
  },
  "soleil-to-grand": {
    title: "Soleil → Grand Ballroom",
    group: "grand-to-soleil",
    badges: [{label: "Reverse route", cls: ""}, {label: "Placeholder copy", cls: "level-change"}],
    steps: [
      "Exit Soleil and head south.",
      {text: "First level change (team to confirm).", elevator: true},
      "Continue south along the resort spine, past the central garden.",
      {text: "Second level change (team to confirm).", elevator: true},
      "Arrive at the Grand Ballroom (26)."
    ]
  },
  "grand-to-cafe": {
    title: "Grand Ballroom → The Café",
    badges: [{label: "Traced in Figma", cls: ""}, {label: "Placeholder copy", cls: "level-change"}],
    steps: [
      "Exit the Grand Ballroom (26) and head east.",
      {text: "Level change at the early bend (team to confirm).", elevator: true},
      "Continue past the central courtyard, following the path north.",
      {text: "Second level change before The Café (team to confirm).", elevator: true},
      "The Café entrance is on your right (team to confirm number)."
    ]
  },
  "cafe-to-grand": {
    title: "The Café → Grand Ballroom",
    group: "grand-to-cafe",
    badges: [{label: "Reverse route", cls: ""}, {label: "Placeholder copy", cls: "level-change"}],
    steps: [
      "Exit The Café.",
      {text: "First level change (team to confirm).", elevator: true},
      "Follow the path south, past the central courtyard.",
      {text: "Second level change (team to confirm).", elevator: true},
      "Arrive at the Grand Ballroom (26)."
    ]
  },
  "grand-to-business": {
    title: "Grand Ballroom → Business Centre",
    badges: [{label: "Traced in Figma", cls: ""}, {label: "Placeholder copy", cls: "level-change"}],
    steps: [
      "Exit the Grand Ballroom (26) and head east through the lobby.",
      {text: "Level change at the first jog (team to confirm).", elevator: true},
      "Follow the corridor toward the central admin block.",
      {text: "Second level change near Business Centre (team to confirm).", elevator: true},
      "Business Centre entrance on your right (team to confirm number)."
    ]
  },
  "business-to-grand": {
    title: "Business Centre → Grand Ballroom",
    group: "grand-to-business",
    badges: [{label: "Reverse route", cls: ""}, {label: "Placeholder copy", cls: "level-change"}],
    steps: [
      "Exit the Business Centre.",
      {text: "First level change (team to confirm).", elevator: true},
      "Follow the corridor west toward the main lobby.",
      {text: "Second level change (team to confirm).", elevator: true},
      "Arrive at the Grand Ballroom (26)."
    ]
  },
  "business-to-cafe": {
    title: "Business Centre → The Café",
    badges: [{label: "Traced in Figma", cls: ""}, {label: "Placeholder copy", cls: "level-change"}, {label: "~1 min", cls: ""}],
    steps: [
      "Exit the Business Centre.",
      {text: "Single level change (team to confirm direction).", elevator: true},
      "Short walk north — The Café is just a few steps away."
    ]
  },
  "cafe-to-business": {
    title: "The Café → Business Centre",
    group: "business-to-cafe",
    badges: [{label: "Reverse route", cls: ""}, {label: "Placeholder copy", cls: "level-change"}, {label: "~1 min", cls: ""}],
    steps: [
      "Exit The Café.",
      {text: "Single level change (team to confirm direction).", elevator: true},
      "Short walk south — Business Centre is just a few steps away."
    ]
  }
};

function setRoute(name) {
  const r = ROUTES[name];
  const groupId = r.group || name;
  document.querySelectorAll("#picker button").forEach(b => {
    b.classList.toggle("active", b.dataset.route === name);
  });
  document.querySelectorAll(".route-group").forEach(g => {
    g.style.display = (g.id === "route-" + groupId) ? "" : "none";
  });
  const active = document.getElementById("route-" + groupId);
  active.querySelectorAll(".route-path").forEach(p => {
    p.style.animation = "none";
    p.offsetHeight;
    p.style.animation = "";
  });
  const badgesHtml = r.badges.map(b => `<span class="badge ${b.cls}">${b.label}</span>`).join(" ");
  const stepsHtml = r.steps.map(s => {
    if (typeof s === "string") return `<li>${s}</li>`;
    let cls = "";
    if (s.elevator) cls = "elevator";
    else if (s.stairsUp) cls = "stairs-up";
    return `<li class="${cls}">${s.text}</li>`;
  }).join("");
  document.getElementById("details").innerHTML = `
    <h2>${r.title} ${badgesHtml}</h2>
    <ol class="steps">${stepsHtml}</ol>
  `;
}

document.getElementById("picker").addEventListener("click", e => {
  if (e.target.dataset.route) setRoute(e.target.dataset.route);
});
